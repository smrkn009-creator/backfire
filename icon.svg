<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#070912"/>

  <g transform="rotate(-14 64 78)">
    <path d="M 20 78 A 44 44 0 0 1 108 78" fill="none" stroke="#4df0ff" stroke-width="22" stroke-linecap="round"/>
    <path d="M 42 76 A 22 22 0 0 1 86 76" fill="none" stroke="#bff8ff" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- incoming shot, and its short trail -->
  <rect x="4" y="20" width="18" height="10" rx="5" fill="#ff5a6e" opacity="0.45"/>
  <circle cx="34" cy="25" r="14" fill="#ff5a6e"/>
  <circle cx="34" cy="25" r="5.5" fill="#ff2f4a"/>

  <!-- returned shot, and its trail -->
  <rect x="106" y="22" width="18" height="10" rx="5" fill="#4df0ff" opacity="0.45"/>
  <circle cx="94" cy="27" r="13" fill="#4df0ff"/>
  <circle cx="94" cy="27" r="5" fill="#bff8ff"/>

  <!-- spark where the shot hit the shield -->
  <circle cx="64" cy="52" r="6" fill="#bff8ff"/>
</svg>